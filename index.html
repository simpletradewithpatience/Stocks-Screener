function norm(s){return String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function field(r,name){const k=Object.keys(r).find(x=>norm(x)===norm(name));return k===undefined?'':r[k]}
function num(r,name){const x=parseFloat(String(field(r,name)).replace(/,/g,'').replace(/₹/g,''));return Number.isFinite(x)?x:NaN}
function stock(r){return String(field(r,'Symbol')||field(r,'Stock Name')||field(r,'Name')||'').trim()}
function fmt(x){return Number.isFinite(x)?x.toLocaleString('en-IN',{maximumFractionDigits:2}):'—'}
function chip(t,tip){return `<span class="chip" title="${tip}">${t}</span>`}
function yes(t,tip){return chip(t,tip)}
function dash(){return '<span class="dash">—</span>'}

function calculate(r){
  const o=num(r,'Today open'),h=num(r,'Today high'),l=num(r,'Today low'),c=num(r,'Today close');
  const po=num(r,'1d ago open'),ph=num(r,'1d ago high'),pl=num(r,'1d ago low'),pc=num(r,'1d ago close');
  const p2o=num(r,'2d ago open'),p2c=num(r,'2d ago close'),p2h=num(r,'2d ago high'),p2l=num(r,'2d ago low');
  const vol=num(r,'Volume'),v20=num(r,'Volume 20 SMA'),ema9=num(r,'EMA 9'),ema20=num(r,'EMA 20'),ema50=num(r,'EMA 50'),ema100=num(r,'EMA 100'),ema200=num(r,'EMA 200');
  const e9p=num(r,'1d ago EMA 9'),e20p=num(r,'1d ago EMA 20'),e50p=num(r,'1d ago EMA 50'),e100p=num(r,'1d ago EMA 100'),e200p=num(r,'1d ago EMA 200');
  const rsi=num(r,'RSI'),macd=num(r,'MACD'),cci=num(r,'CCI'),st=num(r,'Stochastic'),adx=num(r,'ADX'),vwap=num(r,'VWAP'),atr=num(r,'ATR'),cbs=num(r,'Candle Body Strength'),alpha=num(r,'AlphaTrend Buy Marker'),alphaLine=num(r,'AlphaTrend Line');
  const range=h-l, body=Math.abs(c-o), lower=Math.min(o,c)-l, upper=h-Math.max(o,c);
  const bullish=c>o, bearish=c<o, prevBear=pc<po, prevBull=pc>po;

  // Existing bullish patterns
  const engulf=bullish&&prevBear&&c>=po&&o<=pc;
  const hammer=bullish&&body>0&&lower>=2*body&&upper<=body;
  const piercing=bullish&&prevBear&&o<pc&&c>(po+pc)/2&&c<po;
  const tweezer=Math.abs(l-pl)/Math.max(Math.abs(pl),1)<.003&&bullish;

  // Additional bullish patterns adapted directly from the supplied STWP
  // Candlestick Patterns Reversal Engine logic.
  const prevBody=Math.abs(po-pc), firstBody=Math.abs(p2o-p2c);
  const prevRange=Math.max(ph-pl,0), firstRange=Math.max(p2h-p2l,0), currRange=Math.max(h-l,0);
  const prevBodyPct=prevRange>0 ? prevBody/prevRange*100 : 0;
  const firstBodyPct=firstRange>0 ? firstBody/firstRange*100 : 0;
  const currBodyPct=currRange>0 ? body/currRange*100 : 0;

  // Bullish Counter Attack
  const closeMatch = c>=pl && c<=po;
  const openCondition = o<=pc;
  const counterAttack = prevBear && bullish && closeMatch && openCondition;

  // Bullish Above The Stomach
  const midpoint = (po+pc)/2;
  const aboveStomach = prevBear && bullish && o>midpoint && prevBodyPct>=40;

  // Three Inside Up
  const firstBearish = p2c<p2o;
  const secondBullish = pc>po;
  const secondBody = prevBody;
  const secondInsideFirst = po>p2c && pc<p2o;
  const threeInsideUp = firstBearish && secondBullish && secondInsideFirst && firstBody>secondBody && bullish && c>p2o;

  // Three Outside Up
  const secondEngulfsFirst = po<=p2c && pc>=p2o;
  const threeOutsideUp = firstBearish && secondBullish && secondEngulfsFirst && secondBody>firstBody && bullish && c>p2o;

  // Three White Soldiers
  const threeWhiteSoldiers =
    p2c>p2o && pc>po && bullish &&
    firstBodyPct>=60 && prevBodyPct>=60 && currBodyPct>=60 &&
    pc>p2c && c>pc &&
    ph>p2h && h>ph &&
    pl>p2l && l>pl;

  // Morning Star — use the supplied script's stricter three-candle logic:
  // strong bearish candle -> small body with gap down -> bullish recovery
  // closing above the midpoint of the first candle's real body.
  const firstStrongMorning = firstBody > firstRange*0.5;
  const secondSmallMorning = prevBody < firstBody*0.6;
  const gapDownMorning = po < p2c && pc < p2c;
  const thirdRecoveryMorning = c > (p2o+p2c)/2;
  const morning = firstBearish && firstStrongMorning && secondSmallMorning && gapDownMorning && bullish && thirdRecoveryMorning;

  // Bullish Marubozu — strong bullish body with very small total wick.
  const bullishMarubozu = bullish && currRange>0 && body/currRange>=0.90;
  const hh=h>ph,hl=l>pl;
  const pivot=(ph+pl+pc)/3,r1=2*pivot-pl,r2=pivot+(ph-pl),r3=ph+2*(pivot-pl),s1=2*pivot-ph,s2=pivot-(ph-pl),s3=pl-2*(ph-pivot);
  return {
    o,h,l,c,sl:field(r,'Stop loss'),range,body,lower,upper,atr,vol,v20,rsi,macd,cci,st,adx,vwap,alpha,alphaLine,cbs,
    bullish,engulf,hammer,piercing,morning,tweezer,counterAttack,aboveStomach,threeInsideUp,threeOutsideUp,threeWhiteSoldiers,bullishMarubozu,hh,hl,highBreak:hh,
    closeE9:c>ema9,closeE20:c>ema20,closeE50:c>ema50,closeE100:c>ema100,closeE200:c>ema200,
    e920:ema9>ema20,e2050:ema20>ema50,e50100:ema50>ema100,e100200:ema100>ema200,
    stack:ema9>ema20>ema50>ema100>ema200,
    cross920:e9p<=e20p&&ema9>ema20,cross2050:e20p<=e50p&&ema20>ema50,cross50100:e50p<=e100p&&ema50>ema100,cross100200:e100p<=e200p&&ema100>ema200,
    candlevol:bullish&&vol>v20,tight:range<=.8*atr&&c>ema20,wick:hammer,
    reversal:(engulf||piercing||hammer||morning||tweezer)&&c>ema20,
    momentum:rsi>60&&st>80,trendbreak:c>ema20&&ema20>ema50&&h>ph&&vol>v20,
    pivot,r1,r2,r3,s1,s2,s3
  };
}


function openRawDataPage(row,name){
  const win=window.open('','_blank');
  if(!win){alert('Please allow pop-ups to open the raw data page.');return;}

  const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const findKey=(wanted)=>{
    const key=Object.keys(row).find(k=>k.trim().toLowerCase()===wanted.trim().toLowerCase());
    return key;
  };

  const dateKey=findKey('Date')||findKey('date');
  const symbolKey=findKey('Symbol')||findKey('Stock')||findKey('Stock Name');
  const closeKey=findKey('Close')||findKey('Today close')||findKey('today close');

  const topRows=[
    ['📅 Date',dateKey===undefined?'—':row[dateKey]],
    ['📌 Symbol',symbolKey===undefined?name:row[symbolKey]],
    ['💰 Close',closeKey===undefined?'—':row[closeKey]]
  ];

  const metricFields=[
    ['📈 RSI','Rsi'],['📊 MACD','Macd'],['🧭 ADX','Adx'],
    ['🐂 Bullish Trend Strength','Bullish trend strength'],['🎯 VWAP','Vwap'],
    ['⚡ CCI','Cci'],['🔄 Stochastic','Stochastic'],
    ['🕯️ Candle Body Strength','Candle body strength'],
    ['🔥 ATR 5 > 8','100 %bull - atr 5 > 8'],
    ['📈 ATR Rising','100 %bull - atr rising'],
    ['🟢 AlphaTrend Buy Marker','Alphatrend - buy marker'],
    ['📐 AlphaTrend Line','Alphatrend line'],
    ['🌊 Average True Range','Avg_true_range'],['🛡️ Stop Loss','Stop loss']
  ];

  const used=new Set(
    topRows.map(x=>findKey(x[0])).filter(Boolean)
      .concat(metricFields.map(x=>findKey(x[1])).filter(Boolean))
  );
  if(closeKey) used.add(closeKey);

  const topHtml=topRows.map(([label,v],i)=>
    `<div class="hero-card c${i}"><span>${esc(label)}</span><strong>${esc(v)}</strong></div>`
  ).join('');

  const metricHtml=metricFields.map(([label,keyName],i)=>{
    const k=findKey(keyName);
    return `<tr><td><strong>${esc(label)}</strong></td><td>${esc(k===undefined?'—':row[k])}</td></tr>`;
  }).join('');

  const otherHtml=Object.keys(row).filter(k=>!used.has(k)).map(k=>
    `<tr><td><strong>${esc(k)}</strong></td><td>${esc(row[k])}</td></tr>`
  ).join('');

  win.document.open();
  win.document.write(`<!doctype html>

function stwpScore(r){
  const x=calculate(r);
  let total=0;

  // 1. Price Action / 5
  if(Number.isFinite(x.c)&&Number.isFinite(x.o)&&x.c>x.o)
    total += (Number.isFinite(x.cbs)&&x.cbs>60) ? 5 : 3;

  // 2. Tight Range + Directional Bias / 5
  const hs=[num(r,'Today high'),num(r,'1d ago high'),num(r,'2d ago high'),num(r,'3d ago high'),num(r,'4d ago high')];
  const ls=[num(r,'Today low'),num(r,'1d ago low'),num(r,'2d ago low'),num(r,'3d ago low'),num(r,'4d ago low')];
  if(hs.every(Number.isFinite)&&ls.every(Number.isFinite)&&Number.isFinite(x.c)){
    const fiveHigh=Math.max(...hs), fiveLow=Math.min(...ls);
    const fiveRange=fiveHigh-fiveLow;
    const sum=hs.map((h,i)=>h-ls[i]).reduce((a,b)=>a+b,0);
    if(fiveRange>0&&sum>0&&fiveRange/sum<=0.60){
      const position=(x.c-fiveLow)/fiveRange;
      total += position>=0.60 ? 5 : position<=0.40 ? 1 : 3;
    }
  }

  // 3. Wick Absorption / 5
  if(x.bullish && x.lower>=2*x.body && x.body>0) total+=5;
  else if(x.c<x.o && x.upper>=2*x.body && x.body>0) total+=2;

  // 4. Wick Rejection / 5
  if(x.range>0&&x.body>0){
    const cp=(x.c-x.l)/x.range;
    if(x.lower>=1.5*x.body&&cp>=0.70) total+=5;
    else if(x.upper>=1.5*x.body&&cp<=0.30) total+=2;
  }

  // 5. Reversal / Continuation / 10
  const po=num(r,'1d ago open'), pc=num(r,'1d ago close'), p2o=num(r,'2d ago open'), p2c=num(r,'2d ago close');
  const pl=num(r,'1d ago low'), p2l=num(r,'2d ago low'), ph=num(r,'1d ago high');
  const patterns=x.engulf||x.hammer||x.piercing||x.morning||x.tweezer;
  const priorWeakness=(Number.isFinite(pc)&&Number.isFinite(po)&&pc<po) ||
                      (Number.isFinite(p2c)&&Number.isFinite(p2o)&&p2c<p2o) ||
                      (Number.isFinite(pl)&&Number.isFinite(p2l)&&pl<p2l);
  const strongRecovery=x.range>0&&x.bullish&&(x.c-x.l)/x.range>=0.65;
  const reversal=patterns&&priorWeakness&&strongRecovery;
  const continuation=!reversal&&x.bullish&&((x.h>ph&&x.l>pl)||(x.h>ph));
  if(reversal) total+=8;
  else if(continuation) total+=10;

  // 6. Market Structure / 10
  const break5=hs.slice(1).every(Number.isFinite)&&x.h>Math.max(...hs.slice(1));
  const hh=x.h>ph, hl=x.l>pl;
  if(hh&&hl&&break5) total+=10;
  else if(hh&&hl) total+=8;
  else if(hh&&break5) total+=8;
  else if(hl&&break5) total+=7;
  else if(break5) total+=6;
  else if(hh) total+=5;
  else if(hl) total+=4;

  // 7. Trend / Moving Averages / 10
  const e9=num(r,'EMA 9'),e20=num(r,'EMA 20'),e50=num(r,'EMA 50'),e100=num(r,'EMA 100'),e200=num(r,'EMA 200');
  const p9=num(r,'1d ago EMA 9'),p20=num(r,'1d ago EMA 20'),p50=num(r,'1d ago EMA 50'),p100=num(r,'1d ago EMA 100'),p200=num(r,'1d ago EMA 200');
  const full=e9>e20&&e20>e50&&e50>e100&&e100>e200;
  const closeStack=x.c>e9&&e9>e20&&e20>e50;
  const short=e9>e20&&e20>e50;
  const medium=e20>e50&&e50>e100&&e100>e200;
  const close20=x.c>e20&&e9>e20;
  const c920=Number.isFinite(p9)&&Number.isFinite(p20)&&e9>e20&&p9<=p20;
  const c2050=Number.isFinite(p20)&&Number.isFinite(p50)&&e20>e50&&p20<=p50;
  const c50100=Number.isFinite(p50)&&Number.isFinite(p100)&&e50>e100&&p50<=p100;
  const c100200=Number.isFinite(p100)&&Number.isFinite(p200)&&e100>e200&&p100<=p200;
  if(full) total+=10;
  else if(closeStack) total+=9;
  else if(short) total+=7;
  else if(medium) total+=7;
  else if(close20) total+=6;
  else if(c920||c2050) total+=5;
  else if(c50100) total+=4;
  else if(c100200) total+=3;

  // 8. Momentum / 10 — strongest combination gets priority.
  const rs=x.rsi>60, st=x.st>80, mac=x.macd>0, cc=x.cci>100, ad=x.adx>25;
  const strongMom=rs&&st&&mac;
  if(rs&&st&&mac&&cc) total+=10;
  else if(strongMom&&ad) total+=9;
  else if(rs&&st&&mac) total+=8;
  else if(rs&&st&&cc) total+=8;
  else if(rs&&mac&&cc) total+=8;
  else if((rs||st||mac||cc)&&ad) total+=7;
  else if(rs&&st) total+=6;
  else if(rs&&mac) total+=6;
  else if(st&&mac) total+=6;
  else if(Number.isFinite(num(r,'Bullish Trend Strength'))&&num(r,'Bullish Trend Strength')>0) total+=4;

  // 9. Volume / 5
  const vol=x.vol, v20=x.v20, ratio=vol/v20;
  if(Number.isFinite(ratio)){
    if(ratio>2) total+=5;
    else if(ratio>1.5) total+=4;
    else if(ratio>=1) total+=3;
    else if(ratio>=0.75) total+=1;
  }

  // 10. Pivot / Support / 5
  if(Number.isFinite(x.c)&&Number.isFinite(x.r3)&&x.c>x.r3) total+=5;
  else if(x.c>x.r1&&x.c<=x.r3) total+=5;
  else if(x.c>x.pivot&&x.c<=x.r1) total+=4;
  else if(x.c>x.s1&&x.c<=x.pivot) total+=2;
  else if(x.c>x.s2&&x.c<=x.s1) total+=1;

  // 11. VWAP / AlphaTrend / 10
  const aboveVWAP=x.c>x.vwap, alphaBuy=x.alpha>0, aboveAlpha=x.c>x.alphaLine;
  if(aboveVWAP&&alphaBuy&&aboveAlpha) total+=10;
  else if(aboveVWAP&&alphaBuy) total+=8;
  else if(aboveVWAP&&aboveAlpha) total+=8;
  else if(alphaBuy&&aboveAlpha) total+=7;
  else if(aboveVWAP||alphaBuy) total+=5;
  else if(aboveAlpha) total+=4;

  // 12. Candle + Volume / 10
  const strength=x.cbs;
  if(x.bullish&&Number.isFinite(ratio)){
    const strong=Number.isFinite(strength)&&strength>70;
    if(strong&&ratio>2) total+=10;
    else if(strong&&ratio>1.5) total+=9;
    else if(strong&&ratio>=1) total+=8;
    else if(ratio>2) total+=8;
    else if(ratio>1.5) total+=7;
    else if(ratio>=1) total+=6;
    else if(ratio>=0.75) total+=4;
  }

  // 13. Trend + Breakout + Volume / 10
  const strongTrend=full;
  const bullTrend=short;
  const volAbove=ratio>=1&&ratio<=1.5;
  const volSpike=ratio>1.5;
  const heavy=ratio>2;
  const oneDay=Number.isFinite(x.h)&&Number.isFinite(ph)&&x.h>ph;
  const twoDay=oneDay&&Number.isFinite(num(r,'2d ago high'))&&x.h>num(r,'2d ago high');
  const threeDay=twoDay&&Number.isFinite(num(r,'3d ago high'))&&x.h>num(r,'3d ago high');
  const fourDay=threeDay&&Number.isFinite(num(r,'4d ago high'))&&x.h>num(r,'4d ago high');
  if(strongTrend&&break5&&heavy) total+=10;
  else if(strongTrend&&break5&&volSpike) total+=9;
  else if(bullTrend&&break5&&volAbove) total+=8;
  else if(strongTrend&&oneDay&&volSpike) total+=8;
  else if(bullTrend&&oneDay&&volAbove) total+=7;
  else if(bullTrend&&twoDay&&volSpike) total+=7;
  else if(bullTrend&&(threeDay||fourDay)&&volSpike) total+=6;
  else if(bullTrend&&oneDay&&ratio>=0.75) total+=4;

  return Math.max(0,Math.min(100,Math.round(total)));
}


function getSignalNarration(label,text){
  const t=String(text||'').trim();
  if(!t || t==='—') return '';
  const has=(...a)=>a.some(x=>t.toLowerCase().includes(x.toLowerCase()));

  if(label==='📊 CANDLE + VOLUME'){
    if(has('strong')) return 'The stock is showing a strong bullish candle with supportive participation. If buyers remain active, this strength can carry into the next move.';
    return 'The candle is bullish, but the strength of participation is more moderate. Follow-through will be important before treating the move as strong.';
  }
  if(label==='🟢 TIGHT RANGE + DIRECTIONAL BIAS'){
    if(has('tight · bullish')) return 'Price is compressed in a tight range with a bullish bias. A range breakout can trigger a quicker upward move if buyers step in.';
    if(has('tight · bearish')) return 'Price is compressed in a tight range but the bias is bearish. A downside break could increase selling pressure.';
    return 'Price is compressed in a tight range without a clear directional advantage. The next range break may provide the stronger signal.';
  }
  if(label==='🧲 WICK ABSORPTION'){
    if(has('lower')) return 'Selling pressure was absorbed near the lower area of the candle. If buyers continue to defend that zone, price can attempt a recovery.';
    if(has('upper')) return 'Buying pressure was absorbed near the upper area of the candle. Failure to push higher may lead to consolidation or a pullback.';
  }
  if(label==='🧲 WICK REJECTION'){
    if(has('lower')) return 'Price was rejected from lower levels, showing buyers defended that area. A follow-through move higher can strengthen the signal.';
    if(has('upper')) return 'Price was rejected from higher levels, showing sellers defended that area. Further rejection can create a pullback.';
  }
  if(label==='🚀 REVERSAL / CONTINUATION'){
    if(has('reversal')) return 'Price action suggests that weakness may be turning into a bullish reversal. Follow-through above the recent reaction high would strengthen the move.';
    if(has('continuation')) return 'The existing bullish structure is continuing. Holding the recent support and making another higher high can extend the move.';
  }
  if(label==='🔎 PRICE ACTION'){
    if(has('strong body')) return 'The current candle is bullish with a strong body, showing stronger buyer control. Continued follow-through can support the next upward move.';
    return 'The current candle is bullish, showing buyers closed the session above the open. The next move will depend on follow-through.';
  }
  if(label==='🧭 MARKET STRUCTURE'){
    if(has('hh + hl + 5d break')) return 'Price is forming a Higher High and Higher Low while breaking the recent five-day range. This is a strong bullish structure and can support continuation if the breakout holds.';
    if(has('hh + hl')) return 'Price is forming both a Higher High and Higher Low, indicating a developing bullish structure. Another breakout can strengthen the trend.';
    if(has('hh + 5d break')) return 'A Higher High is accompanied by a five-day breakout. Holding above the breakout area can support further upside.';
    if(has('hl + 5d break')) return 'A Higher Low is present along with a five-day breakout. Buyers are defending structure while attempting to move higher.';
    if(has('hh')) return 'Price has formed a Higher High, showing improving bullish pressure. A Higher Low would provide stronger structural confirmation.';
    if(has('hl')) return 'Price has formed a Higher Low, showing buyers are defending at a higher level. A Higher High would strengthen the bullish structure.';
    if(has('5d break')) return 'Price has broken the recent five-day high. Holding above the breakout level can support continuation.';
  }
  if(label==='📈 TREND / MOVING AVERAGES'){
    if(has('full bullish ema stack')) return 'All major EMAs are aligned bullishly, with shorter averages above longer averages. This supports an established bullish trend, provided price continues to hold above key averages.';
    if(has('close > ema9 > ema20 > ema50')) return 'Price is above the short and medium-term EMAs with bullish alignment. This supports continued upward pressure if the alignment holds.';
    if(has('ema9 > ema20 > ema50')) return 'Short and medium-term EMAs are aligned bullishly. This suggests improving trend structure and can support continuation.';
    if(has('ema20 > ema50 > ema100 > ema200')) return 'The medium and long-term EMAs are aligned bullishly, indicating a broader upward trend.';
    if(has('ema9/20 bullish crossover')) return 'EMA 9 has crossed above EMA 20, indicating improving short-term trend momentum. Sustained price strength can turn the crossover into a stronger trend move.';
  }
  if(label==='⚡ MOMENTUM'){
    if(has('rsi + stochastic + macd + cci')) return 'Several momentum measures are bullish at the same time. This shows broad buying pressure and can support further upside, although momentum may become stretched.';
    if(has('strong momentum + adx')) return 'Momentum is strong and ADX indicates a meaningful trend. This combination can support continuation while the trend remains intact.';
    if(has('bullish trend strength')) return 'The trend-strength measure is indicating bullish pressure. Further price confirmation can strengthen the move.';
  }
  if(label==='📊 VOLUME'){
    if(has('heavy vol')) return 'Volume is expanding strongly relative to its reference average. Heavy participation can fuel a breakout or sharp continuation, but it can also increase volatility.';
    if(has('vol spike')) return 'Volume is significantly above its reference average, showing increased participation. If price holds the move, the higher activity can support continuation.';
    if(has('above avg')) return 'Volume is above its reference average, showing improving participation. Stronger expansion can provide additional confirmation.';
  }
  if(label==='🎯 PIVOT / SUPPORT'){
    if(has('above r2')) return 'Price is trading above the second resistance level. Holding this area can open the path toward the next resistance, while rejection can trigger a pullback.';
    if(has('above r1')) return 'Price has moved above the first resistance level. Holding above it can support a move toward the next resistance.';
    if(has('above pivot')) return 'Price is above the central pivot, giving the current structure a bullish bias. Holding above the pivot supports the bullish case.';
    if(has('below s1')) return 'Price has moved below first support, indicating increased downside pressure. Reclaiming the level would be important for recovery.';
  }
  if(label==='🎯 VWAP / ALPHATREND'){
    if(has('above vwap + alphatrend buy + above alphatrend')) return 'Price is above VWAP and AlphaTrend with a buy condition. Multiple bullish references agree, supporting continuation if price holds these levels.';
    if(has('above vwap')) return 'Price is above VWAP, showing buyers are currently controlling the average traded area. Holding above VWAP can support further strength.';
    if(has('alphatrend buy')) return 'AlphaTrend is showing a buy condition. Continued price strength above its reference can improve confirmation.';
  }
  if(label==='📉 PULLBACK'){
    if(has('pullback + bullish recovery')) return 'Price had been retracing but is now recovering strongly. If the recovery holds and a recent high is reclaimed, the pullback may be ending and a new upward leg can develop.';
    if(has('healthy bullish pullback')) return 'Price is retracing within an existing bullish structure without a clear breakdown. This can create a better-risk entry area if support holds and buyers return.';
    if(has('pullback to ema20')) return 'Price is pulling back toward EMA20 while the bullish context remains intact. A successful hold and bullish reaction from this area can support continuation.';
    if(has('deep pullback')) return 'The retracement is relatively deep, so the bullish setup needs caution. A recovery from support can restore strength, while further weakness can damage the structure.';
    if(has('pullback breakdown')) return 'The pullback has broken below an important short-term reference. This can signal weakening bullish structure and a deeper correction unless price quickly reclaims the level.';
  }
  if(label==='🏔️ DONCHIAN 20D / 55D'){
    return 'Price is interacting with a recent trading-range boundary. A sustained breakout can attract fresh buying, while rejection can send price back into the range.';
  }
  if(label==='⚡ SHORT-TERM BREAKOUT'){
    return 'The stock is attempting to move beyond its recent short-term range. Holding the breakout can support continuation; failure can result in a quick pullback.';
  }
  if(label==='🚀 TREND + BREAKOUT + VOLUME'){
    if(has('strong trend')) return 'Bullish trend, breakout and strong volume are aligning. This is a stronger confirmation setup, although the breakout still needs to hold.';
    return 'Trend, breakout and participation are aligning. Continued volume and a sustained breakout can support further upside.';
  }
  if(label==='💥 MOMENTUM + VOLUME'){
    if(has('strong momentum')) return 'Momentum is strong and supported by active volume. This combination can help the move continue if price remains above key support.';
    return 'Momentum and participation are positive. Stronger volume follow-through can provide additional confirmation.';
  }
  return explanations[label]||'This signal describes the current price and market condition. Continued strength can support the move, while a loss of the key level may weaken it.';
}

function signalWithTip(text, explanation){
  if(!text || text==='—' || !explanation) return text;
  return `<span class="signal-tip" tabindex="0">${escapeHtml(text)}<span class="signal-tip-box">${escapeHtml(explanation)}</span></span>`;
}
function addSignalTipToCell(cell,label){
  if(!cell) return;
  const value=stripHTML(cell.innerText||cell.textContent||'');
  const exp=explanations[label];
  if(value && value!=='—' && exp){
    cell.innerHTML=signalWithTip(value,exp);
  }
}
function escapeHtml(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stripHTML(v){
  const d=document.createElement('div');d.innerHTML=String(v??'');
  return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim();
}
function downloadStockDataForStock(stockName){
  const r=rawData.find(x=>stock(x)===stockName);
  if(!r) return;

  const x=calculate(r);
  const highs=[
    num(r,'Today high'),
    num(r,'1d ago high'),
    num(r,'2d ago high'),
    num(r,'3d ago high'),
    num(r,'4d ago high')
  ];
  const stop=num(r,'Stop loss');
  const entry=highs.every(Number.isFinite)?Math.max(...highs):NaN;

  const output=[
    ['⭐ STWP Bullish Score',stwpScore(r)+'/100'],
    ['STOCK',stockName||'—'],
    ['CLOSE',Number.isFinite(x.c)?fmt(x.c):'—'],
    ['🎯 ENTRY PRICE',Number.isFinite(entry)&&Number.isFinite(stop)&&entry>stop?fmt(entry,2):'—'],
    ['STOP LOSS',Number.isFinite(stop)?fmt(stop):'—']
  ];

  // Capture exactly the visible main-page analysis for this stock.
  const tableRows=[...tbody.querySelectorAll('tr')];
  for(const tr of tableRows){
    const labelCell=tr.querySelector('th');
    if(!labelCell) continue;

    const label=stripHTML(labelCell.innerText||labelCell.textContent||'');
    if(label==='📥 DOWNLOAD'||label==='⭐ STWP BULLISH SCORE'||label==='STOCK'||label==='CLOSE'||label==='🎯 ENTRY PRICE'||label==='STOP LOSS') continue;

    const headers=[...tbody.querySelectorAll('tr.stock-row th')];
    const col=headers.findIndex(th=>stripHTML(th.innerText||th.textContent||'')===stockName);
    if(col<1) continue;

    const cells=[...tr.querySelectorAll('td')];
    const cell=cells[col-1];
    output.push([label,cell?stripHTML(cell.innerText||cell.textContent||''):'—']);
  }

  // AI-friendly TXT: one continuous paragraph, with each main-page
  // category written as a simple statement.
  const clean=v=>String(v??'—').replace(/\s+/g,' ').trim();
  const paragraph =
    `STWP Bullish Screener Data for ${clean(stockName)}: ` +
    output.map(([label,value])=>{
      if(label==='STOCK') return `Stock is ${clean(value)}`;
      if(label==='⭐ STWP Bullish Score') return `the STWP Bullish Score is ${clean(value)}`;
      if(label==='CLOSE') return `the Close is ${clean(value)}`;
      if(label==='🎯 ENTRY PRICE') return `the Entry Price is ${clean(value)}`;
      if(label==='STOP LOSS') return `the Stop Loss is ${clean(value)}`;
      return `${clean(label)} is ${clean(value)}`;
    }).join('. ') + '.';

  const txt =
    `STWP BULLISH SCREENER\n\n` +
    `${paragraph}\n`;

  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`STWP_${stockName.replace(/[^a-z0-9_-]+/gi,'_')}_Screener_Data.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

function render(){
  const q=norm(search.value);
  const list=rawData
    .filter(r=>!q||norm(stock(r)).includes(q))
    .sort((a,b)=>stwpScore(b)-stwpScore(a));
  tbody.innerHTML='';

      return yes('🚀 Close > EMA9 > EMA20 > EMA50',
        'Close is above EMA9, which is above EMA20, which is above EMA50.');

    if(shortMedium)
      return yes('📈 EMA9 > EMA20 > EMA50',
        'Short- and medium-term EMAs are arranged bullishly: EMA9 > EMA20 > EMA50.');

    if(mediumLong)
      return yes('📈 EMA20 > EMA50 > EMA100 > EMA200',
        'Medium- and long-term EMAs are arranged bullishly: EMA20 > EMA50 > EMA100 > EMA200.');

    if(close20Short)
      return yes('📈 Close > EMA20 + EMA9 > EMA20',
        'Price is above EMA20 and the short-term EMA9 is also above EMA20.');

    if(cross920)
      return yes('🔄 EMA9/20 Bullish Crossover',
        'EMA9 has crossed above EMA20 today; yesterday EMA9 was at or below EMA20.');

    if(cross2050)
      return yes('🔄 EMA20/50 Bullish Crossover',
        'EMA20 has crossed above EMA50 today; yesterday EMA20 was at or below EMA50.');

    if(cross50100)
      return yes('🔄 EMA50/100 Bullish Crossover',
        'EMA50 has crossed above EMA100 today; yesterday EMA50 was at or below EMA100.');

    if(cross100200)
      return yes('🔄 EMA100/200 Bullish Crossover',
        'EMA100 has crossed above EMA200 today; yesterday EMA100 was at or below EMA200.');

    return dash();
  }]);


  rows.push(['⚡ MOMENTUM',r=>{
    const x=calculate(r);
    const rsi=Number(x.rsi), st=Number(x.st), macd=Number(x.macd);
    const cci=Number(x.cci), adx=Number(x.adx);
    const bts=Number(x.bts);

    const rsiStrong=Number.isFinite(rsi)&&rsi>60;
    const stStrong=Number.isFinite(st)&&st>80;
    const macdPositive=Number.isFinite(macd)&&macd>0;
    const cciStrong=Number.isFinite(cci)&&cci>100;
    const adxStrong=Number.isFinite(adx)&&adx>25;

    // Locked 10-state priority. The first matching state is displayed.
    if(rsiStrong&&stStrong&&macdPositive&&cciStrong)
      return yes('🏆 RSI + Stochastic + MACD + CCI',
        `RSI ${fmt(rsi,1)} > 60, Stochastic ${fmt(st,1)} > 80, MACD ${fmt(macd,2)} > 0 and CCI ${fmt(cci,1)} > 100.`);

    if(rsiStrong&&stStrong&&macdPositive)
      return yes('🚀 RSI + Stochastic + MACD',
        `RSI ${fmt(rsi,1)} > 60, Stochastic ${fmt(st,1)} > 80 and MACD ${fmt(macd,2)} > 0.`);

    if(rsiStrong&&stStrong)
      return yes('🔥 RSI + Stochastic Strong',
        `RSI ${fmt(rsi,1)} > 60 and Stochastic ${fmt(st,1)} > 80.`);

    if(rsiStrong&&macdPositive)
      return yes('🔥 RSI + MACD Positive',
        `RSI ${fmt(rsi,1)} > 60 and MACD ${fmt(macd,2)} > 0.`);

    if(stStrong&&macdPositive)
      return yes('🔥 Stochastic + MACD Positive',
        `Stochastic ${fmt(st,1)} > 80 and MACD ${fmt(macd,2)} > 0.`);

    if(rsiStrong&&stStrong&&cciStrong)
      return yes('🚀 RSI + Stochastic + CCI',
        `RSI ${fmt(rsi,1)} > 60, Stochastic ${fmt(st,1)} > 80 and CCI ${fmt(cci,1)} > 100.`);

    if(rsiStrong&&macdPositive&&cciStrong)
      return yes('🚀 RSI + MACD + CCI',
        `RSI ${fmt(rsi,1)} > 60, MACD ${fmt(macd,2)} > 0 and CCI ${fmt(cci,1)} > 100.`);

    if(adxStrong && (rsiStrong||stStrong||macdPositive||cciStrong))
      return yes('🧭 Momentum + ADX',
        `ADX ${fmt(adx,1)} > 25 and at least one bullish momentum condition is active.`);

    if(adxStrong && rsiStrong&&stStrong&&macdPositive)
      return yes('🏆 Strong Momentum + ADX',
        `ADX ${fmt(adx,1)} > 25 with strong RSI, Stochastic and MACD momentum.`);

    if(Number.isFinite(bts) && bts>0)
      return yes('⚡ Bullish Trend Strength',
        'The CSV Bullish Trend Strength condition is positive.');

    return dash();
  }]);


  rows.push(['📊 VOLUME',r=>{
    const vol=num(r,'Volume');
    const periods=[
      [5,'Volume 5 SMA','Vol x 5d'],
      [7,'Volume 7 SMA','Vol x 7d'],
      [10,'Volume 10 SMA','Vol x 10d'],
      [20,'Volume 20 SMA','Vol x 20d'],
      [30,'Volume 30 SMA','Vol x 30d']
    ];

    let selected=null;
    for(const [period,smaField,multipleField] of periods){
      const sma=num(r,smaField);
      if(Number.isFinite(vol)&&Number.isFinite(sma)&&vol>sma){
        selected={period,sma,multiple:num(r,multipleField)};
      }
    }

    if(!selected || !Number.isFinite(selected.multiple)) return dash();

    const ratio=selected.multiple;
    let label='📈 Above Avg';
    let emoji='📈';

    if(ratio>2){
      label='Heavy Vol';
      emoji='🚀';
    }else if(ratio>1.5){
      label='Vol Spike';
      emoji='💥';
    }

    return yes(
      `📈 VOL > ${selected.period} SMA · ${emoji} ${fmt(ratio,2)}× ${label}`,
      `Today’s volume is above the ${selected.period} SMA and is ${fmt(ratio,2)}× that SMA.`
    );
  }]);


  rows.push(['🎯 PIVOT / SUPPORT',r=>{
    const x=calculate(r);
    const c=Number(x.c);
    const pivot=Number(x.pivot);
    const r1=Number(x.r1), r2=Number(x.r2), r3=Number(x.r3);
    const s1=Number(x.s1), s2=Number(x.s2), s3=Number(x.s3);

    if(![c,pivot,r1,r2,r3,s1,s2,s3].every(Number.isFinite)) return dash();

    if(c>r2 && c<=r3)
      return yes('🚀 Above R2 · Below R3','Close is above Pivot R2 and below R3.');
    if(c>r1 && c<=r2)
      return yes('🚀 Above R1 · Below R2','Close is above R1 and below R2.');
    if(c>pivot && c<=r1)
      return yes('🟢 Above Pivot · Below R1','Close is above Pivot and below R1.');
    if(c<=pivot && c>s1)
      return yes('🔻 Below Pivot · Above S1','Close is below Pivot and above S1.');
    if(c<=s1 && c>s2)
      return yes('🔻 Below S1 · Above S2','Close is below S1 and above S2.');
    if(c<=s2 && c>s3)
      return yes('🔻 Below S2 · Above S3','Close is below S2 and above S3.');
    if(c>r3)
      return yes('🚀 Above R3','Close is above R3.');
    if(c<=s3)
      return yes('🔻 Below S3','Close is below S3.');
    return dash();
  }]);



  rows.push(['🎯 VWAP / ALPHATREND',r=>{
    const x=calculate(r);
    const c=Number(x.c), vwap=Number(x.vwap), alpha=Number(x.alpha), alphaLine=Number(x.alphaLine);

    const aboveVWAP=Number.isFinite(c)&&Number.isFinite(vwap)&&c>vwap;
    const alphaBuy=Number.isFinite(alpha)&&alpha>0;
    const aboveAlpha=Number.isFinite(c)&&Number.isFinite(alphaLine)&&c>alphaLine;

    // Locked 7-state priority: strongest combination first.
    if(aboveVWAP&&alphaBuy&&aboveAlpha)
      return yes('🏆 Above VWAP + AlphaTrend Buy + Above AlphaTrend',
        'Price is above VWAP, AlphaTrend has a Buy signal, and price is above the AlphaTrend line.');

    if(aboveVWAP&&alphaBuy)
      return yes('🚀 Above VWAP + AlphaTrend Buy',
        'Price is above VWAP and AlphaTrend has a Buy signal.');

    if(aboveVWAP&&aboveAlpha)
      return yes('🚀 Above VWAP + Above AlphaTrend',
        'Price is above VWAP and above the AlphaTrend line.');

    if(alphaBuy&&aboveAlpha)
      return yes('🚀 AlphaTrend Buy + Above AlphaTrend',
        'AlphaTrend has a Buy signal and price is above the AlphaTrend line.');

    if(aboveVWAP)
      return yes('📈 Above VWAP',
        'Price is above VWAP.');

    if(alphaBuy)
      return yes('📈 AlphaTrend Buy',
        'AlphaTrend has a Buy signal.');

    if(aboveAlpha)
      return yes('📈 Above AlphaTrend',
        'Price is above the AlphaTrend line.');

    return dash();
  }]);



  // Final per-stock download row: exports ONLY the complete main-page screener data.
  rows.push(['📉 PULLBACK',r=>{
    const x=calculate(r);
    const close=x.c, prevClose=num(r,'1d ago  close');
    const ema20=num(r,'EMA 20');
    const todayHigh=num(r,'Today high'), todayLow=num(r,'Today low');
    const prevHigh=num(r,'1d ago high'), prevLow=num(r,'1d ago  low');

    if(!Number.isFinite(close)||!Number.isFinite(prevClose)||
       !Number.isFinite(todayHigh)||!Number.isFinite(todayLow)) return dash();

    const fiveHigh=Math.max(
      num(r,'1d ago high'),num(r,'2d ago  high'),
      num(r,'3d ago high'),num(r,'4d ago high')
    );

    const hh=todayHigh>prevHigh;
    const hl=todayLow>prevLow;
    const fiveBreak=Number.isFinite(fiveHigh)&&todayHigh>fiveHigh;
    const emaBull=Number.isFinite(ema20)&&close>ema20;
    const bullishContext=hh||hl||fiveBreak||emaBull;
    const retracing=close<prevClose || todayHigh<prevHigh;

    if(!bullishContext || !retracing) return dash();

    const range=todayHigh-todayLow;
    const recovery=range>0 && close>=todayLow+range*0.65 && close>prevClose;
    const nearEma20=Number.isFinite(ema20)&&Math.abs(close-ema20)/ema20<=0.015;
    const emaBroken=Number.isFinite(ema20)&&close<ema20;
    const deep=range>0 && (close<=todayLow+range*0.30 || emaBroken);

    if(recovery) return yes('🚀 Pullback + Bullish Recovery',
      'Price has shown recent weakness but is recovering strongly.');
    if(deep && emaBroken) return yes('🔻 Pullback Breakdown',
      'The pullback has moved below EMA20, indicating weakening short-term structure.');
    if(deep) return yes('📉 Deep Pullback',
      'The retracement is relatively deep and needs caution.');
    if(nearEma20) return yes('🎯 Pullback to EMA20',
      'Price is retracing toward EMA20 while the bullish context remains intact.');
    return yes('🟢 Healthy Bullish Pullback',
      'Price is retracing within an existing bullish context without a clear breakdown.');
  }]);

  rows.push(['📥 DOWNLOAD',r=>{
    const name=stock(r)||'STOCK';
    return `<div class="download-cell"><button class="download-btn" data-stock-download="${escapeHtml(name)}">📥 Download</button></div>`;
  }]);

  rows.forEach(([label,fn],idx)=>{
    const tr=document.createElement('tr');
    const th=document.createElement('th');
    th.textContent=label;
    tr.appendChild(th);
    list.forEach(r=>{
      const td=document.createElement('td');
      td.innerHTML=fn(r);
      const signalValue=stripHTML(td.innerText||td.textContent||'');
      const signalExplanation=getSignalNarration(label,signalValue);
      // Keep the Download button as a real button; do not wrap it in a tooltip.
      if(label!=='📥 DOWNLOAD' && signalValue && signalValue!=='—' && signalExplanation){
        td.innerHTML=signalWithTip(signalValue,signalExplanation);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  if(typeof refreshHorizontalScroll==='function') requestAnimationFrame(refreshHorizontalScroll);
}

function loadRaw(data){
  rawData=data;
  render();
}

fileInput.addEventListener('change',()=>{
  selectedFile=fileInput.files[0]||null;
  processBtn.disabled=!selectedFile;
  fileName.textContent=selectedFile?selectedFile.name:'';
  status.textContent=selectedFile?'File ready — click Process':'No file selected';
  rawData=[];
  table.style.display='none';empty.style.display='block';empty.innerHTML='Upload your CSV and click <b>Process</b>.';
});

processBtn.addEventListener('click',()=>{
  if(!selectedFile)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const text=String(reader.result||'').replace(/^\uFEFF/,'');
      const lines=text.split(/\r?\n/).filter(x=>x.trim()!=='');
      const matrix=lines.map(line=>{
        const out=[];let cur='',q=false;
        for(let i=0;i<line.length;i++){
          const ch=line[i];
          if(ch==='"' && line[i+1]==='"'){cur+='"';i++;}
          else if(ch==='"')q=!q;
          else if(ch===','&&!q){out.push(cur);cur='';}
          else cur+=ch;
        }
        out.push(cur);return out;
      });
      const hs=matrix[0].map(x=>x.trim());
      const data=matrix.slice(1).map(a=>{const o={};hs.forEach((h,i)=>o[h]=a[i]??'');return o}).filter(o=>stock(o));
      loadRaw(data);
      status.textContent=`✓ Processed ${data.length} stocks`;
    }catch(e){status.textContent='⚠ Could not process CSV';console.error(e)}
  };
  reader.readAsText(selectedFile);
});

search.addEventListener('input',()=>{if(rawData.length)render()});

tbody.addEventListener('click',e=>{
  const tip=e.target.closest('.signal-tip');
  if(tip){
    e.stopPropagation();
    document.querySelectorAll('.signal-tip-box.show').forEach(x=>x.classList.remove('show'));
    const box=tip.querySelector('.signal-tip-box');
    if(box){
      const rect=tip.getBoundingClientRect();
      box.classList.add('show');
      box.style.left=Math.max(8,Math.min(window.innerWidth-310,rect.left))+'px';
      box.style.top=Math.min(window.innerHeight-110,rect.bottom+7)+'px';
    }
    return;
  }

  const btn=e.target.closest('.download-btn');
  if(btn){
    e.preventDefault();
    e.stopPropagation();
    const name=btn.getAttribute('data-stock-download');
    if(name) downloadStockDataForStock(name);
  }
});
document.addEventListener('click',()=>document.querySelectorAll('.signal-tip-box.show').forEach(x=>x.classList.remove('show')));




function setupHorizontalScroll(){
  const wrap=document.getElementById('tableWrap');
  const left=document.getElementById('scrollLeft');
  const right=document.getElementById('scrollRight');
  if(!wrap||!left||!right)return;

  const place=()=>{
    const rect=wrap.getBoundingClientRect();
    const top=Math.max(100,Math.min(window.innerHeight-55,rect.top+Math.min(rect.height,window.innerHeight-120)/2-21));
    left.style.top=top+'px';
    right.style.top=top+'px';
  };

  const update=()=>{
    const max=Math.max(0,wrap.scrollWidth-wrap.clientWidth);
    left.disabled=false;
    right.disabled=false;
    left.style.opacity=max<=2 || wrap.scrollLeft<=2 ? '.35' : '.92';
    right.style.opacity=max<=2 || wrap.scrollLeft>=max-2 ? '.35' : '.92';
    place();
  };

  // Do not depend on scrollBy; assigning scrollLeft works consistently
  // across browsers and desktop/mobile WebViews.
  left.onclick=(ev)=>{
    ev.preventDefault();
    ev.stopPropagation();
    wrap.scrollLeft=Math.max(0,wrap.scrollLeft-Math.max(300,wrap.clientWidth*.75));
    setTimeout(update,50);
  };

  right.onclick=(ev)=>{
    ev.preventDefault();
    ev.stopPropagation();
    wrap.scrollLeft=Math.min(wrap.scrollWidth-wrap.clientWidth,
      wrap.scrollLeft+Math.max(300,wrap.clientWidth*.75));
    setTimeout(update,50);
  };

  wrap.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',update);
  window.addEventListener('scroll',place,{passive:true});
  requestAnimationFrame(update);
  return update;
}

const refreshHorizontalScroll=setupHorizontalScroll();

document.getElementById('resetBtn').addEventListener('click',()=>{
  selectedFile=null;
  rawData=INITIAL_RAW.map(r=>({...r}));
  fileInput.value='';
  processBtn.disabled=true;
  fileName.textContent='';
  status.textContent='Reset — upload a CSV and click Process';
  search.value='';
  table.style.display='none';
  empty.style.display='block';
  empty.innerHTML='Upload your CSV and click <b>Process</b>.';
  count.textContent='';
});
