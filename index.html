function norm(s){return String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function field(r,name){const k=Object.keys(r).find(x=>norm(x)===norm(name));return k===undefined?'':r[k]}
function num(r,name){const x=parseFloat(String(field(r,name)).replace(/,/g,'').replace(/₹/g,''));return Number.isFinite(x)?x:NaN}
function stock(r){return String(field(r,'Symbol')||field(r,'Stock Name')||field(r,'Name')||'').trim()}
function fmt(x){return Number.isFinite(x)?x.toLocaleString('en-IN',{maximumFractionDigits:2}):'—'}

function calculate(r){
  const o=num(r,'Today open'),h=num(r,'Today high'),l=num(r,'Today low'),c=num(r,'Today close');
  const po=num(r,'1d ago open'),ph=num(r,'1d ago high'),pl=num(r,'1d ago low'),pc=num(r,'1d ago close');
  const p2o=num(r,'2d ago open'),p2c=num(r,'2d ago close');
  const vol=num(r,'Volume'),v20=num(r,'Volume 20 SMA'),ema9=num(r,'EMA 9'),ema20=num(r,'EMA 20'),ema50=num(r,'EMA 50'),ema100=num(r,'EMA 100'),ema200=num(r,'EMA 200');
  const e9p=num(r,'1d ago EMA 9'),e20p=num(r,'1d ago EMA 20'),e50p=num(r,'1d ago EMA 50'),e100p=num(r,'1d ago EMA 100'),e200p=num(r,'1d ago EMA 200');
  const rsi=num(r,'RSI'),macd=num(r,'MACD'),cci=num(r,'CCI'),st=num(r,'Stochastic'),adx=num(r,'ADX'),vwap=num(r,'VWAP'),atr=num(r,'ATR'),cbs=num(r,'Candle Body Strength'),alpha=num(r,'AlphaTrend Buy Marker'),alphaLine=num(r,'AlphaTrend Line');
  const range=h-l, body=Math.abs(c-o), lower=Math.min(o,c)-l, upper=h-Math.max(o,c);
  const bullish=c>o, prevBear=pc<po;
  const engulf=bullish&&prevBear&&c>=po&&o<=pc;
  const hammer=bullish&&body>0&&lower>=2*body&&upper<=body;
  const piercing=bullish&&prevBear&&o<pc&&c>(po+pc)/2&&c<po;
  const morning=p2c<p2o&&Math.abs(po-pc)<Math.abs(p2o-p2c)*.6&&bullish&&c>(p2o+p2c)/2;
  const tweezer=Math.abs(l-pl)/Math.max(Math.abs(pl),1)<.003&&bullish;
  const hh=h>ph,hl=l>pl;
  const pivot=(ph+pl+pc)/3,r1=2*pivot-pl,r2=pivot+(ph-pl),r3=ph+2*(pivot-pl),s1=2*pivot-ph,s2=pivot-(ph-pl),s3=pl-2*(ph-pivot);
  return {
    o,h,l,c,sl:field(r,'Stop loss'),range,body,lower,upper,atr,vol,v20,rsi,macd,cci,st,adx,vwap,alpha,alphaLine,cbs,
    bullish,engulf,hammer,piercing,morning,tweezer,hh,hl,highBreak:hh,
    closeE9:c>ema9,closeE20:c>ema20,closeE50:c>ema50,closeE100:c>ema100,closeE200:c>ema200,
    e920:ema9>ema20,e2050:ema20>ema50,e50100:ema50>ema100,e100200:ema100>ema200,
    stack:ema9>ema20>ema50>ema100>ema200,
    cross920:e9p<=e20p&&ema9>ema20,cross2050:e20p<=e50p&&ema20>ema50,cross50100:e50p<=e100p&&ema50>ema100,cross100200:e100p<=e200p&&ema100>ema200,
    candlevol:bullish&&vol>v20,tight:range<=.8*atr&&c>ema20,wick:hammer,
    reversal:(engulf||piercing||hammer||morning||tweezer)&&c>ema20,
    momentum:rsi>60&&st>80,trendbreak:c>ema20&&ema20>ema50&&h>ph&&vol>v20,
    pivot,r1,r2,r3,s1,s2,s3
  };
}

function stwpScore(r){
  const x=calculate(r);
  let total=0;

  // 1. Price Action / 5
  if(Number.isFinite(x.c)&&Number.isFinite(x.o)&&x.c>x.o)
    total += (Number.isFinite(x.cbs)&&x.cbs>60) ? 5 : 3;

  // 2. Tight Range + Directional Bias / 5
  const hs=[num(r,'Today high'),num(r,'1d ago high'),num(r,'2d ago high'),num(r,'3d ago high'),num(r,'4d ago high')];
  const ls=[num(r,'Today low'),num(r,'1d ago low'),num(r,'2d ago low'),num(r,'3d ago low'),num(r,'4d ago low')];
  if(hs.every(Number.isFinite)&&ls.every(Number.isFinite)&&Number.isFinite(x.c)){
    const fiveHigh=Math.max(...hs), fiveLow=Math.min(...ls);
    const fiveRange=fiveHigh-fiveLow;
    const sum=hs.map((h,i)=>h-ls[i]).reduce((a,b)=>a+b,0);
    if(fiveRange>0&&sum>0&&fiveRange/sum<=0.60){
      const position=(x.c-fiveLow)/fiveRange;
      total += position>=0.60 ? 5 : position<=0.40 ? 1 : 3;
    }
  }

  // 3. Wick Absorption / 5
  if(x.bullish && x.lower>=2*x.body && x.body>0) total+=5;
  else if(x.c<x.o && x.upper>=2*x.body && x.body>0) total+=2;

  // 4. Wick Rejection / 5
  if(x.range>0&&x.body>0){
    const cp=(x.c-x.l)/x.range;
    if(x.lower>=1.5*x.body&&cp>=0.70) total+=5;
    else if(x.upper>=1.5*x.body&&cp<=0.30) total+=2;
  }

  // 5. Reversal / Continuation / 10
  const po=num(r,'1d ago open'), pc=num(r,'1d ago close'), p2o=num(r,'2d ago open'), p2c=num(r,'2d ago close');
  const pl=num(r,'1d ago low'), p2l=num(r,'2d ago low'), ph=num(r,'1d ago high');
  const patterns=x.engulf||x.hammer||x.piercing||x.morning||x.tweezer;
  const priorWeakness=(Number.isFinite(pc)&&Number.isFinite(po)&&pc<po) ||
                      (Number.isFinite(p2c)&&Number.isFinite(p2o)&&p2c<p2o) ||
                      (Number.isFinite(pl)&&Number.isFinite(p2l)&&pl<p2l);
  const strongRecovery=x.range>0&&x.bullish&&(x.c-x.l)/x.range>=0.65;
  const reversal=patterns&&priorWeakness&&strongRecovery;
  const continuation=!reversal&&x.bullish&&((x.h>ph&&x.l>pl)||(x.h>ph));
  if(reversal) total+=8;
  else if(continuation) total+=10;

  // 6. Market Structure / 10
  const break5=hs.slice(1).every(Number.isFinite)&&x.h>Math.max(...hs.slice(1));
  const hh=x.h>ph, hl=x.l>pl;
  if(hh&&hl&&break5) total+=10;
  else if(hh&&hl) total+=8;
  else if(hh&&break5) total+=8;
  else if(hl&&break5) total+=7;
  else if(break5) total+=6;
  else if(hh) total+=5;
  else if(hl) total+=4;

  // 7. Trend / Moving Averages / 10
  const e9=num(r,'EMA 9'),e20=num(r,'EMA 20'),e50=num(r,'EMA 50'),e100=num(r,'EMA 100'),e200=num(r,'EMA 200');
  const p9=num(r,'1d ago EMA 9'),p20=num(r,'1d ago EMA 20'),p50=num(r,'1d ago EMA 50'),p100=num(r,'1d ago EMA 100'),p200=num(r,'1d ago EMA 200');
  const full=e9>e20&&e20>e50&&e50>e100&&e100>e200;
  const closeStack=x.c>e9&&e9>e20&&e20>e50;
  const short=e9>e20&&e20>e50;
  const medium=e20>e50&&e50>e100&&e100>e200;
  const close20=x.c>e20&&e9>e20;
  const c920=Number.isFinite(p9)&&Number.isFinite(p20)&&e9>e20&&p9<=p20;
  const c2050=Number.isFinite(p20)&&Number.isFinite(p50)&&e20>e50&&p20<=p50;
  const c50100=Number.isFinite(p50)&&Number.isFinite(p100)&&e50>e100&&p50<=p100;
  const c100200=Number.isFinite(p100)&&Number.isFinite(p200)&&e100>e200&&p100<=p200;
  if(full) total+=10;
  else if(closeStack) total+=9;
  else if(short) total+=7;
  else if(medium) total+=7;
  else if(close20) total+=6;
  else if(c920||c2050) total+=5;
  else if(c50100) total+=4;
  else if(c100200) total+=3;

  // 8. Momentum / 10 — strongest combination gets priority.
  const rs=x.rsi>60, st=x.st>80, mac=x.macd>0, cc=x.cci>100, ad=x.adx>25;
  const strongMom=rs&&st&&mac;
  if(rs&&st&&mac&&cc) total+=10;
  else if(strongMom&&ad) total+=9;
  else if(rs&&st&&mac) total+=8;
  else if(rs&&st&&cc) total+=8;
  else if(rs&&mac&&cc) total+=8;
  else if((rs||st||mac||cc)&&ad) total+=7;
  else if(rs&&st) total+=6;
  else if(rs&&mac) total+=6;
  else if(st&&mac) total+=6;
  else if(Number.isFinite(num(r,'Bullish Trend Strength'))&&num(r,'Bullish Trend Strength')>0) total+=4;

  // 9. Volume / 5
  const vol=x.vol, v20=x.v20, ratio=vol/v20;
  if(Number.isFinite(ratio)){
    if(ratio>2) total+=5;
    else if(ratio>1.5) total+=4;
    else if(ratio>=1) total+=3;
    else if(ratio>=0.75) total+=1;
  }

  // 10. Pivot / Support / 5
  if(Number.isFinite(x.c)&&Number.isFinite(x.r3)&&x.c>x.r3) total+=5;
  else if(x.c>x.r1&&x.c<=x.r3) total+=5;
  else if(x.c>x.pivot&&x.c<=x.r1) total+=4;
  else if(x.c>x.s1&&x.c<=x.pivot) total+=2;
  else if(x.c>x.s2&&x.c<=x.s1) total+=1;

  // 11. VWAP / AlphaTrend / 10
  const aboveVWAP=x.c>x.vwap, alphaBuy=x.alpha>0, aboveAlpha=x.c>x.alphaLine;
  if(aboveVWAP&&alphaBuy&&aboveAlpha) total+=10;
  else if(aboveVWAP&&alphaBuy) total+=8;
  else if(aboveVWAP&&aboveAlpha) total+=8;
  else if(alphaBuy&&aboveAlpha) total+=7;
  else if(aboveVWAP||alphaBuy) total+=5;
  else if(aboveAlpha) total+=4;

  // 12. Candle + Volume / 10
  const strength=x.cbs;
  if(x.bullish&&Number.isFinite(ratio)){
    const strong=Number.isFinite(strength)&&strength>70;
    if(strong&&ratio>2) total+=10;
    else if(strong&&ratio>1.5) total+=9;
    else if(strong&&ratio>=1) total+=8;
    else if(ratio>2) total+=8;
    else if(ratio>1.5) total+=7;
    else if(ratio>=1) total+=6;
    else if(ratio>=0.75) total+=4;
  }

  // 13. Trend + Breakout + Volume / 10
  const strongTrend=full;
  const bullTrend=short;
  const volAbove=ratio>=1&&ratio<=1.5;
  const volSpike=ratio>1.5;
  const heavy=ratio>2;
  const oneDay=Number.isFinite(x.h)&&Number.isFinite(ph)&&x.h>ph;
  const twoDay=oneDay&&Number.isFinite(num(r,'2d ago high'))&&x.h>num(r,'2d ago high');
  const threeDay=twoDay&&Number.isFinite(num(r,'3d ago high'))&&x.h>num(r,'3d ago high');
  const fourDay=threeDay&&Number.isFinite(num(r,'4d ago high'))&&x.h>num(r,'4d ago high');
  if(strongTrend&&break5&&heavy) total+=10;
  else if(strongTrend&&break5&&volSpike) total+=9;
  else if(bullTrend&&break5&&volAbove) total+=8;
  else if(strongTrend&&oneDay&&volSpike) total+=8;
  else if(bullTrend&&oneDay&&volAbove) total+=7;
  else if(bullTrend&&twoDay&&volSpike) total+=7;
  else if(bullTrend&&(threeDay||fourDay)&&volSpike) total+=6;
  else if(bullTrend&&oneDay&&ratio>=0.75) total+=4;

  return Math.max(0,Math.min(100,Math.round(total)));
}

    const h3=num(r,'2d ago high'), l3=num(r,'2d ago low');

    const fiveHigh=Math.max(...highs);
    const fiveLow=Math.min(...lows);

    // Classify compression using the five individual daily ranges.
    const dailyRanges=[
      h1-l1,h2-l2,h3-l3,h4-l4,h5-l5
    ];
    const sumDailyRanges=dailyRanges.reduce((a,b)=>a+b,0);

    // Tight = the combined 5-day range is materially smaller than
    // the sum of the five daily ranges, indicating price compression.
    const compressionRatio=fiveRange/sumDailyRanges;
    if(!Number.isFinite(compressionRatio) || compressionRatio>0.60) return dash();

    // Direction is based on where today's close sits inside the 5-day range.
    const position=(close-fiveLow)/fiveRange;
    let bias='Neutral';
    if(position>=0.60) bias='Bullish';
    else if(position<=0.40) bias='Bearish';

    if(bullishTrend && break4 && spike)
      return yes('📈 Bullish Trend · 4D Breakout · 💥 Volume Spike',
        'Bullish EMA trend, today’s high breaks the previous 4 daily highs, with volume above 1.5× the 20-day average.');

    if(bullishTrend && (break1||break2||break3||break4) && normal)
      return yes('📈 Bullish Trend · Breakout · 📊 Normal Volume',
        'Bullish EMA trend and a previous-high breakout are present, but volume remains within the normal range.');

    return dash();
  }]);


  rows.push(['🔎 PRICE ACTION',r=>{
    const x=calculate(r);
    if(!Number.isFinite(x.c)||!Number.isFinite(x.o)) return dash();
    if(x.c>x.o && Number(x.cbs)>60)
      return yes('🔥 Bullish + Strong Body','Close is above Open and Candle Body Strength is above 60.');
    if(x.c>x.o)
      return yes('🟢 Bullish','Close is above Open.');
    return dash();
  }]);

  rows.push(['🧭 MARKET STRUCTURE',r=>{
    const h0=num(r,'Today high'), l0=num(r,'Today low');
    const h1=num(r,'1d ago high'), l1=num(r,'1d ago low');
    const h2=num(r,'2d ago high'), l2=num(r,'2d ago low');
    const h3=num(r,'3d ago high'), l3=num(r,'3d ago low');
    const h4=num(r,'4d ago high');

    const hh=Number.isFinite(h0)&&Number.isFinite(h1)&&h0>h1;
    const hl=Number.isFinite(l0)&&Number.isFinite(l1)&&l0>l1;
    const break5=[h1,h2,h3,h4].every(Number.isFinite) &&
                 Number.isFinite(h0) && h0>Math.max(h1,h2,h3,h4);

    if(hh&&hl&&break5)
      return yes('🚀 HH + HL + 5D Break','Today has a Higher High and Higher Low, while today’s high breaks all four previous daily highs.');
    if(hh&&hl)
      return yes('🚀 HH + HL','Today has both a Higher High and a Higher Low versus the previous day.');
    if(hh&&break5)
      return yes('🚀 HH + 5D Break','Today has a Higher High and breaks the previous 5-day high range.');
    if(hl&&break5)
      return yes('📈 HL + 5D Break','Today has a Higher Low and breaks the previous 5-day high range.');
    if(hh)
      return yes('📈 HH','Today has a Higher High versus the previous day.');
    if(hl)
      return yes('📈 HL','Today has a Higher Low versus the previous day.');
    if(break5)
      return yes('🚀 5D Break','Today’s high breaks all four previous daily highs.');
    return dash();
  }]);


  rows.push(['📈 TREND / MOVING AVERAGES',r=>{
    const x=calculate(r);
    const c=Number(x.c);
    const e9=num(r,'EMA 9'), e20=num(r,'EMA 20'), e50=num(r,'EMA 50');
    const e100=num(r,'EMA 100'), e200=num(r,'EMA 200');

    const p9=num(r,'1d ago EMA 9'), p20=num(r,'1d ago EMA 20');
    const p50=num(r,'1d ago EMA 50'), p100=num(r,'1d ago EMA 100');
    const p200=num(r,'1d ago EMA 200');

    if(![c,e9,e20,e50,e100,e200].every(Number.isFinite)) return dash();

    const fullStack=e9>e20&&e20>e50&&e50>e100&&e100>e200;
    const close9_20_50=c>e9&&e9>e20&&e20>e50;
    const shortMedium=e9>e20&&e20>e50;
    const mediumLong=e20>e50&&e50>e100&&e100>e200;
    const close20Short=c>e20&&e9>e20;

    // Actual bullish crossovers: today's relationship bullish,
    // yesterday's relationship was not bullish.
    const cross920=Number.isFinite(p9)&&Number.isFinite(p20)&&e9>e20&&p9<=p20;
    const cross2050=Number.isFinite(p20)&&Number.isFinite(p50)&&e20>e50&&p20<=p50;
    const cross50100=Number.isFinite(p50)&&Number.isFinite(p100)&&e50>e100&&p50<=p100;
    const cross100200=Number.isFinite(p100)&&Number.isFinite(p200)&&e100>e200&&p100<=p200;

    // One highest-priority state is displayed.
    if(fullStack)
      return yes('🏆 Full Bullish EMA Stack',
        'EMA9 > EMA20 > EMA50 > EMA100 > EMA200 — the complete bullish EMA hierarchy is in place.');

    if(close9_20_50)
      return yes('🚀 Close > EMA9 > EMA20 > EMA50',
        'Close is above EMA9, which is above EMA20, which is above EMA50.');

    if(shortMedium)
      return yes('📈 EMA9 > EMA20 > EMA50',
        'Short- and medium-term EMAs are arranged bullishly: EMA9 > EMA20 > EMA50.');

    if(mediumLong)
      return yes('📈 EMA20 > EMA50 > EMA100 > EMA200',
        'Medium- and long-term EMAs are arranged bullishly: EMA20 > EMA50 > EMA100 > EMA200.');

    if(close20Short)
      return yes('📈 Close > EMA20 + EMA9 > EMA20',
        'Price is above EMA20 and the short-term EMA9 is also above EMA20.');

    if(cross920)
      return yes('🔄 EMA9/20 Bullish Crossover',
        'EMA9 has crossed above EMA20 today; yesterday EMA9 was at or below EMA20.');

    if(cross2050)
      return yes('🔄 EMA20/50 Bullish Crossover',
        'EMA20 has crossed above EMA50 today; yesterday EMA20 was at or below EMA50.');

    if(cross50100)
      return yes('🔄 EMA50/100 Bullish Crossover',
        'EMA50 has crossed above EMA100 today; yesterday EMA50 was at or below EMA100.');

    if(cross100200)
      return yes('🔄 EMA100/200 Bullish Crossover',
        'EMA100 has crossed above EMA200 today; yesterday EMA100 was at or below EMA200.');

    return dash();
  }]);


  rows.push(['⚡ MOMENTUM',r=>{
    const x=calculate(r);
    const rsi=Number(x.rsi), st=Number(x.st), macd=Number(x.macd);
    const cci=Number(x.cci), adx=Number(x.adx);
    const bts=Number(x.bts);

    const rsiStrong=Number.isFinite(rsi)&&rsi>60;
    const stStrong=Number.isFinite(st)&&st>80;
    const macdPositive=Number.isFinite(macd)&&macd>0;
    const cciStrong=Number.isFinite(cci)&&cci>100;
    const adxStrong=Number.isFinite(adx)&&adx>25;

    // Locked 10-state priority. The first matching state is displayed.
    if(rsiStrong&&stStrong&&macdPositive&&cciStrong)
      return yes('🏆 RSI + Stochastic + MACD + CCI',
        `RSI ${fmt(rsi,1)} > 60, Stochastic ${fmt(st,1)} > 80, MACD ${fmt(macd,2)} > 0 and CCI ${fmt(cci,1)} > 100.`);

    if(rsiStrong&&stStrong&&macdPositive)
      return yes('🚀 RSI + Stochastic + MACD',
        `RSI ${fmt(rsi,1)} > 60, Stochastic ${fmt(st,1)} > 80 and MACD ${fmt(macd,2)} > 0.`);

    if(rsiStrong&&stStrong)
      return yes('🔥 RSI + Stochastic Strong',
        `RSI ${fmt(rsi,1)} > 60 and Stochastic ${fmt(st,1)} > 80.`);

    if(rsiStrong&&macdPositive)
      return yes('🔥 RSI + MACD Positive',
        `RSI ${fmt(rsi,1)} > 60 and MACD ${fmt(macd,2)} > 0.`);

    if(stStrong&&macdPositive)
      return yes('🔥 Stochastic + MACD Positive',
        `Stochastic ${fmt(st,1)} > 80 and MACD ${fmt(macd,2)} > 0.`);

    if(rsiStrong&&stStrong&&cciStrong)
      return yes('🚀 RSI + Stochastic + CCI',
        `RSI ${fmt(rsi,1)} > 60, Stochastic ${fmt(st,1)} > 80 and CCI ${fmt(cci,1)} > 100.`);

    if(rsiStrong&&macdPositive&&cciStrong)
      return yes('🚀 RSI + MACD + CCI',
        `RSI ${fmt(rsi,1)} > 60, MACD ${fmt(macd,2)} > 0 and CCI ${fmt(cci,1)} > 100.`);

    if(adxStrong && (rsiStrong||stStrong||macdPositive||cciStrong))
      return yes('🧭 Momentum + ADX',
        `ADX ${fmt(adx,1)} > 25 and at least one bullish momentum condition is active.`);

    if(adxStrong && rsiStrong&&stStrong&&macdPositive)
      return yes('🏆 Strong Momentum + ADX',
        `ADX ${fmt(adx,1)} > 25 with strong RSI, Stochastic and MACD momentum.`);

    if(Number.isFinite(bts) && bts>0)
      return yes('⚡ Bullish Trend Strength',
        'The CSV Bullish Trend Strength condition is positive.');

    return dash();
  }]);


  rows.push(['📊 VOLUME',r=>{
    const vol=num(r,'Volume');
    const periods=[
      [5,'Volume 5 SMA','Vol x 5d'],
      [7,'Volume 7 SMA','Vol x 7d'],
      [10,'Volume 10 SMA','Vol x 10d'],
      [20,'Volume 20 SMA','Vol x 20d'],
      [30,'Volume 30 SMA','Vol x 30d']
    ];

    let selected=null;
    for(const [period,smaField,multipleField] of periods){
      const sma=num(r,smaField);
      if(Number.isFinite(vol)&&Number.isFinite(sma)&&vol>sma){
        selected={period,sma,multiple:num(r,multipleField)};
      }
    }

    if(!selected || !Number.isFinite(selected.multiple)) return dash();

    const ratio=selected.multiple;
    let label='📈 Above Avg';
    let emoji='📈';

    if(ratio>2){
      label='Heavy Vol';
      emoji='🚀';
    }else if(ratio>1.5){
      label='Vol Spike';
      emoji='💥';
    }

    return yes(
      `📈 VOL > ${selected.period} SMA · ${emoji} ${fmt(ratio,2)}× ${label}`,
      `Today’s volume is above the ${selected.period} SMA and is ${fmt(ratio,2)}× that SMA.`
    );
  }]);


  rows.push(['🎯 PIVOT / SUPPORT',r=>{
    const x=calculate(r);
    const c=Number(x.c);
    const pivot=Number(x.pivot);
    const r1=Number(x.r1), r2=Number(x.r2), r3=Number(x.r3);
    const s1=Number(x.s1), s2=Number(x.s2), s3=Number(x.s3);

    if(![c,pivot,r1,r2,r3,s1,s2,s3].every(Number.isFinite)) return dash();

    if(c>r2 && c<=r3)
      return yes('🚀 Above R2 · Below R3','Close is above Pivot R2 and below R3.');
    if(c>r1 && c<=r2)
      return yes('🚀 Above R1 · Below R2','Close is above R1 and below R2.');
    if(c>pivot && c<=r1)
      return yes('🟢 Above Pivot · Below R1','Close is above Pivot and below R1.');
    if(c<=pivot && c>s1)
      return yes('🔻 Below Pivot · Above S1','Close is below Pivot and above S1.');
    if(c<=s1 && c>s2)
      return yes('🔻 Below S1 · Above S2','Close is below S1 and above S2.');
    if(c<=s2 && c>s3)
      return yes('🔻 Below S2 · Above S3','Close is below S2 and above S3.');
    if(c>r3)
      return yes('🚀 Above R3','Close is above R3.');
    if(c<=s3)
      return yes('🔻 Below S3','Close is below S3.');
    return dash();
  }]);



  rows.push(['🎯 VWAP / ALPHATREND',r=>{
    const x=calculate(r);
    const c=Number(x.c), vwap=Number(x.vwap), alpha=Number(x.alpha), alphaLine=Number(x.alphaLine);

    const aboveVWAP=Number.isFinite(c)&&Number.isFinite(vwap)&&c>vwap;
    const alphaBuy=Number.isFinite(alpha)&&alpha>0;
    const aboveAlpha=Number.isFinite(c)&&Number.isFinite(alphaLine)&&c>alphaLine;

    // Locked 7-state priority: strongest combination first.
    if(aboveVWAP&&alphaBuy&&aboveAlpha)
      return yes('🏆 Above VWAP + AlphaTrend Buy + Above AlphaTrend',
        'Price is above VWAP, AlphaTrend has a Buy signal, and price is above the AlphaTrend line.');

    if(aboveVWAP&&alphaBuy)
      return yes('🚀 Above VWAP + AlphaTrend Buy',
        'Price is above VWAP and AlphaTrend has a Buy signal.');

    if(aboveVWAP&&aboveAlpha)
      return yes('🚀 Above VWAP + Above AlphaTrend',
        'Price is above VWAP and above the AlphaTrend line.');

    if(alphaBuy&&aboveAlpha)
      return yes('🚀 AlphaTrend Buy + Above AlphaTrend',
        'AlphaTrend has a Buy signal and price is above the AlphaTrend line.');

    if(aboveVWAP)
      return yes('📈 Above VWAP',
        'Price is above VWAP.');

    if(alphaBuy)
      return yes('📈 AlphaTrend Buy',
        'AlphaTrend has a Buy signal.');

    if(aboveAlpha)
      return yes('📈 Above AlphaTrend',
        'Price is above the AlphaTrend line.');

    return dash();
  }]);


  rows.forEach(([label,fn],idx)=>{
    const tr=document.createElement('tr');
    const th=document.createElement('th');th.textContent=label;tr.appendChild(th);
    list.forEach(r=>{const td=document.createElement('td');td.innerHTML=fn(r);tr.appendChild(td)});
    tbody.appendChild(tr);
  });
}

function loadRaw(data){
  rawData=data;
  render();
}

fileInput.addEventListener('change',()=>{
  selectedFile=fileInput.files[0]||null;
  processBtn.disabled=!selectedFile;
  fileName.textContent=selectedFile?selectedFile.name:'';
  status.textContent=selectedFile?'File ready — click Process':'No file selected';
  rawData=[];
  table.style.display='none';empty.style.display='block';empty.innerHTML='Upload your CSV and click <b>Process</b>.';
});

processBtn.addEventListener('click',()=>{
  if(!selectedFile)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const text=String(reader.result||'').replace(/^\uFEFF/,'');
      const lines=text.split(/\r?\n/).filter(x=>x.trim()!=='');
      const matrix=lines.map(line=>{
        const out=[];let cur='',q=false;
        for(let i=0;i<line.length;i++){
          const ch=line[i];
          if(ch==='"' && line[i+1]==='"'){cur+='"';i++;}
          else if(ch==='"')q=!q;
          else if(ch===','&&!q){out.push(cur);cur='';}
          else cur+=ch;
        }
        out.push(cur);return out;
      });
      const hs=matrix[0].map(x=>x.trim());
      const data=matrix.slice(1).map(a=>{const o={};hs.forEach((h,i)=>o[h]=a[i]??'');return o}).filter(o=>stock(o));
      loadRaw(data);
      status.textContent=`✓ Processed ${data.length} stocks`;
    }catch(e){status.textContent='⚠ Could not process CSV';console.error(e)}
  };
  reader.readAsText(selectedFile);
});

search.addEventListener('input',()=>{if(rawData.length)render()});

// No data is displayed until the user uploads and clicks Process.
</script>
